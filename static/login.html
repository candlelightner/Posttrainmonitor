<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
  <title>Sign in · Posttrain</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f4;color:#292524;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}.top{padding:30px 42px;display:flex;align-items:center;gap:11px}.brand{font-size:25px;font-weight:650;letter-spacing:-1.2px}.mark{display:flex;gap:3px;align-items:center;width:24px;height:28px;transform:rotate(-12deg)}.mark i{width:5px;height:14px;background:#31595c;border-radius:2px}.mark i:nth-child(2){height:24px}.mark i:nth-child(3){height:19px}main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 22px 90px}.card{width:100%;max-width:420px;background:#fff;border:1px solid #e7e5e4;border-radius:12px;padding:38px}.eyebrow{color:#ae7644;font-size:9px;font-weight:650;letter-spacing:1.5px;margin:0 0 20px}h1{font-size:29px;font-weight:550;letter-spacing:-1px;line-height:1.2;margin:0 0 12px}.intro{font-size:12px;color:#78716c;line-height:1.8;margin:0 0 29px}label{display:block;font-size:11px;font-weight:500;margin-bottom:9px}input{font:inherit;font-size:15px;border:1px solid #d6d3d1;background:#fff;color:#292524;width:100%;height:46px;padding:10px 13px;border-radius:7px;outline:none;transition:border-color .15s,box-shadow .15s}input:focus{border-color:#31595c;box-shadow:0 0 0 3px #31595c14}button{width:100%;border:0;border-radius:7px;background:#31595c;color:#fff;min-height:45px;font:inherit;font-size:12px;font-weight:550;cursor:pointer;margin-top:17px;transition:background .15s}button:hover{background:#24484b}button:focus-visible{outline:2px solid #31595c;outline-offset:4px}button:disabled{opacity:.7;cursor:wait}.error{background:#fbf0e7;color:#9b5e33;border:1px solid #efd9c7;border-radius:6px;padding:11px 12px;font-size:11px;line-height:1.7;margin:0 0 20px}.error[hidden]{display:none}.card-footer{font-size:9px;color:#a8a29e;line-height:1.7;border-top:1px solid #e7e5e4;margin:26px 0 0;padding-top:19px;display:flex;gap:7px;align-items:center}.dot{width:5px;height:5px;border-radius:50%;background:#31595c;flex-shrink:0}.footer{padding:0 25px 25px;text-align:center;font-size:9px;color:#a8a29e}@media(max-width:540px){.top{padding:25px}.card{padding:31px 26px}main{padding-bottom:65px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="top"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand">posttrain</span></header>
  <main><section class="card" aria-labelledby="title">
    <p class="eyebrow">TRAINING, IN VIEW</p><h1 id="title">Welcome back.</h1>
    <p class="intro">Enter the password to open the live training dashboard.</p>
    <p class="error" id="error" role="alert" hidden></p>
    <form method="post" action="/login" id="login-form">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="error">
      <button type="submit" id="submit">Open dashboard <span aria-hidden="true">↗</span></button>
    </form>
    <p class="card-footer"><span class="dot" aria-hidden="true"></span>Live aggregate statistics · updates every 30 seconds</p>
  </section></main>
  <footer class="footer">posttrain.dirigent.uk · <a href="/legal" style="color:inherit;text-underline-offset:3px">Legal &amp; Privacy</a></footer>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    if (error) { const element = document.getElementById('error'); element.hidden = false; element.textContent = error === 'rate' ? 'Too many attempts. Please wait a little, then try again.' : 'That password did not match. Please try again.'; }
    document.getElementById('login-form').addEventListener('submit', () => { const button = document.getElementById('submit'); button.disabled = true; button.textContent = 'Opening dashboard…'; });
  </script>
</body>
</html>
